---
- name: Installera och starta webbserver
  hosts: webservers
  become: true

  tasks:
    - name: Installera Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Säkerställ att Nginx är igång
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
